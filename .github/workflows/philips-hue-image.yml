# Builds and publishes the Philips Hue plug-in's image when it changes, for amd64, arm64 and arm/v7:
#   ghcr.io/<owner>/starboard-plugin-philips-hue:<version> and :latest
# The digest is printed in the run's summary; put it in philips-hue/starboard-plugin.json in place of the tag.
name: Philips Hue image
on:
  push:
    branches: [main]
    paths: ["philips-hue/Dockerfile", "philips-hue/app.py", "philips-hue/sbplugin.py", "philips-hue/hue.py", "philips-hue/words.py", ".github/workflows/philips-hue-image.yml"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The plug-in compiles and its tests pass
        run: python3 -m py_compile philips-hue/app.py philips-hue/hue.py philips-hue/words.py && python3 -m unittest tests.test_philips_hue
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        run: echo "v=$(python3 -c "import json;print(json.load(open('philips-hue/starboard-plugin.json'))['version'])")" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: philips-hue
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            ghcr.io/themightytrex/starboard-plugin-philips-hue:${{ steps.version.outputs.v }}
            ghcr.io/themightytrex/starboard-plugin-philips-hue:latest
          labels: |
            org.opencontainers.image.title=Starboard Philips Hue plug-in
            org.opencontainers.image.description=Hue lights, scenes and schedules through the bridge on the home network
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Digest
        run: |
          echo "Digest: ${{ steps.build.outputs.digest }}" | tee -a "$GITHUB_STEP_SUMMARY"
