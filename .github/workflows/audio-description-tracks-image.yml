# Builds and publishes the Audio description tracks plug-in's image when it changes, for amd64, arm64 and arm/v7:
#   ghcr.io/<owner>/starboard-plugin-audio-description-tracks:<version> and :latest
# The digest is printed in the run's summary; put it in audio-description-tracks/starboard-plugin.json in place of the tag.
name: Audio description tracks image
on:
  push:
    branches: [main]
    paths: ["audio-description-tracks/Dockerfile", "audio-description-tracks/app.py", "audio-description-tracks/sbplugin.py", ".github/workflows/audio-description-tracks-image.yml"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The plug-in compiles and its tests pass
        run: python3 -m py_compile audio-description-tracks/app.py && python3 -m unittest tests.test_audio_description_tracks
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        run: echo "v=$(python3 -c "import json;print(json.load(open('audio-description-tracks/starboard-plugin.json'))['version'])")" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: audio-description-tracks
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            ghcr.io/themightytrex/starboard-plugin-audio-description-tracks:${{ steps.version.outputs.v }}
            ghcr.io/themightytrex/starboard-plugin-audio-description-tracks:latest
          labels: |
            org.opencontainers.image.title=Starboard audio description tracks plug-in
            org.opencontainers.image.description=Adds a described sound track to its film or episode in Jellyfin, with mkvmerge
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Digest
        run: |
          echo "Digest: ${{ steps.build.outputs.digest }}" | tee -a "$GITHUB_STEP_SUMMARY"
