# Builds and publishes the Library clean-up plug-in's image when it changes, for amd64, arm64 and arm/v7:
#   ghcr.io/<owner>/starboard-plugin-library-cleanup:<version> and :latest
# The digest is printed in the run's summary; put it in library-cleanup/starboard-plugin.json in place of the tag.
name: Library clean-up image
on:
  push:
    branches: [main]
    paths: ["library-cleanup/Dockerfile", "library-cleanup/app.py", "library-cleanup/sbplugin.py", ".github/workflows/library-cleanup-image.yml"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The plug-in compiles and its tests pass
        run: python3 -m py_compile library-cleanup/app.py && python3 -m unittest tests.test_library_cleanup
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        run: echo "v=$(python3 -c "import json;print(json.load(open('library-cleanup/starboard-plugin.json'))['version'])")" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: library-cleanup
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            ghcr.io/themightytrex/starboard-plugin-library-cleanup:${{ steps.version.outputs.v }}
            ghcr.io/themightytrex/starboard-plugin-library-cleanup:latest
          labels: |
            org.opencontainers.image.title=Starboard library clean-up plug-in
            org.opencontainers.image.description=Moves watched films and series to the holding folder; never deletes
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Digest
        run: |
          echo "Digest: ${{ steps.build.outputs.digest }}" | tee -a "$GITHUB_STEP_SUMMARY"
