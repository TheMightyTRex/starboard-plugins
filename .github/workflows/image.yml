# Builds and publishes the examples' shared image when an example changes, for amd64, arm64 and arm/v7:
#   ghcr.io/<owner>/starboard-plugin-examples:<version> and :latest
# The digest is printed in the run's summary; put it in tools/examples-digest.txt and run tools/make_examples.py.
name: Image
on:
  push:
    branches: [main]
    paths: ["Dockerfile", "_shared/**", "*/app.py", ".github/workflows/image.yml"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every app compiles
        run: python3 -m py_compile _shared/sbplugin.py */app.py
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        run: |
          echo "v=$(python3 -c "import sys;sys.path.insert(0,'tools');import examples_src;print(examples_src.IMAGE_VERSION)")" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            ghcr.io/themightytrex/starboard-plugin-examples:${{ steps.version.outputs.v }}
            ghcr.io/themightytrex/starboard-plugin-examples:latest
          labels: |
            org.opencontainers.image.title=Starboard example plug-ins
            org.opencontainers.image.description=Small example plug-ins for Starboard
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Digest
        run: |
          echo "Digest: ${{ steps.build.outputs.digest }}" | tee -a "$GITHUB_STEP_SUMMARY"
