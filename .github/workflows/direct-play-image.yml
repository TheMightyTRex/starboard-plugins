# Builds and publishes the Direct play plug-in's image when it changes, for amd64, arm64 and arm/v7:
#   ghcr.io/<owner>/starboard-plugin-direct-play:<version> and :latest
# The digest is printed in the run's summary; put it in direct-play/starboard-plugin.json in place of the tag.
name: Direct play image
on:
  push:
    branches: [main]
    paths: ["direct-play/Dockerfile", "direct-play/app.py", "direct-play/sbplugin.py", ".github/workflows/direct-play-image.yml"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ffmpeg for the tests, which make tiny sample films with it
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg)
      - name: The plug-in compiles and its tests pass
        run: python3 -m py_compile direct-play/app.py && python3 -m unittest tests.test_direct_play
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        run: echo "v=$(python3 -c "import json;print(json.load(open('direct-play/starboard-plugin.json'))['version'])")" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: direct-play
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            ghcr.io/themightytrex/starboard-plugin-direct-play:${{ steps.version.outputs.v }}
            ghcr.io/themightytrex/starboard-plugin-direct-play:latest
          labels: |
            org.opencontainers.image.title=Starboard direct play plug-in
            org.opencontainers.image.description=Makes films and series play directly on chosen devices, with ffmpeg
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Digest
        run: |
          echo "Digest: ${{ steps.build.outputs.digest }}" | tee -a "$GITHUB_STEP_SUMMARY"
